<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ticket — Hors ligne</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f0e4;
        color: #16202b;
        font-family: Arial, sans-serif;
      }
      main {
        width: min(92vw, 560px);
        padding: 32px;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 48px rgba(17, 24, 32, 0.12);
      }
      h1 { margin: 0 0 12px; font-size: 2rem; }
      p { margin: 0 0 12px; line-height: 1.7; color: #526171; }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 18px;
        border-radius: 14px;
        background: #d39a36;
        color: #16202b;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vous êtes hors ligne</h1>
      <p>La plateforme reste disponible pour certaines pages déjà visitées. Reconnectez-vous à Internet pour retrouver les achats, le checkout et les actions sécurisées.</p>
      <a href="/">Revenir à l'accueil</a>
    </main>
  </body>
</html>
